<section class="contact-section" aria-labelledby="contact-heading">
  <div class="section-heading">
    <p class="eyebrow">Your directory</p>
    <h2 id="contact-heading">Contact person</h2>
  </div>

  <article class="contact-card">
    <div class="contact-card__top">
      <div class="avatar" aria-hidden="true">CP</div>
      <span class="contact-badge">
        <span class="status-dot" aria-hidden="true"></span>
        Contact
      </span>
    </div>

    <div class="contact-details">
      <div class="detail">
        <span class="detail__label">Name</span>
        <span class="detail__value">name</span>
      </div>
      <div class="detail">
        <span class="detail__label">Email address</span>
        <span class="detail__value">email</span>
      </div>
      <div class="detail">
        <span class="detail__label">Phone number</span>
        <span class="detail__value">phone</span>
      </div>
    </div>

    <label class="consent">
      <input type="checkbox">
      <span class="consent__text">Consent to receive advertisements</span>
    </label>

    <div class="card-actions">
      <button class="button button--primary" type="button">Update contact</button>
      <button class="button button--secondary" type="button">Delete</button>
    </div>
  </article>
</section>
